# Build the api image from the repository root:
#   gcloud builds submit --config infra/cloudbuild-api.yaml --substitutions _IMAGE=REGION-docker.pkg.dev/PROJECT/kizuki/api .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "services/api/Dockerfile", "-t", "$_IMAGE", "."]
images: ["$_IMAGE"]
